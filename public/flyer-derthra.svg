<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">DERTHRA — Soluciones tecnológicas</title>
  <desc id="desc">Flyer de servicios de inteligencia artificial, IoT, investigación y desarrollo, cursos y asesoría académica.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242b"/>
      <stop offset="1" stop-color="#30343b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd52f"/>
      <stop offset="1" stop-color="#e8ad00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#252a31" flood-opacity=".10"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="#f1f2f1"/>
  <rect width="1080" height="600" fill="url(#hero)"/>
  <rect width="1080" height="600" fill="url(#grid)"/>

  <!-- Marca DERTHRA en geometría vectorial -->
  <g transform="translate(72 52)">
    <path d="M22 0h34l17 29-17 29H22L5 29zM22 63h34l17 29-17 29H22L5 92zM82 32h34l17 29-17 29H82L65 61z" fill="url(#gold)"/>
    <text x="3" y="151" fill="#ffd52f" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1">DERTHRA</text>
  </g>
  <text x="1008" y="102" text-anchor="end" fill="#f4c83e" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">TECNOLOGÍA · FORMACIÓN · INNOVACIÓN</text>

  <text x="72" y="265" fill="#f4c83e" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="5">SOLUCIONES PARA EMPRESAS Y PERSONAS</text>
  <text x="72" y="356" fill="#ffffff" font-family="Arial,sans-serif" font-size="69" font-weight="800" letter-spacing="-2">Ideas que se</text>
  <text x="72" y="438" fill="#ffffff" font-family="Arial,sans-serif" font-size="69" font-weight="800" letter-spacing="-2">convierten en</text>
  <text x="72" y="520" fill="#f4c83e" font-family="Arial,sans-serif" font-size="69" font-weight="800" letter-spacing="-2">soluciones reales.</text>
  <text x="75" y="566" fill="#d7dbe0" font-family="Arial,sans-serif" font-size="23">Tecnología aplicada, asesoría especializada y formación práctica.</text>
  <g opacity=".18" transform="translate(820 292) scale(1.52)">
    <path d="M22 0h34l17 29-17 29H22L5 29zM22 63h34l17 29-17 29H22L5 92zM82 32h34l17 29-17 29H82L65 61z" fill="#f4c83e"/>
  </g>

  <text x="72" y="664" fill="#8a6800" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="4">LO QUE HACEMOS</text>
  <text x="72" y="712" fill="#20242b" font-family="Arial,sans-serif" font-size="37" font-weight="750">Servicios para avanzar con confianza</text>

