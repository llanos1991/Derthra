  <text x="220" y="1300" fill="#444e59" font-family="Arial,sans-serif" font-size="18">+51 956 397 062</text>
  <circle cx="414" cy="1293" r="3" fill="#d3a500"/>
  <g transform="translate(434 1282)" aria-label="Correo electrónico" fill="none" stroke="#9a7600" stroke-width="2.2" stroke-linejoin="round">
    <rect x="0" y="0" width="25" height="19" rx="3"/>
    <path d="M2 3l10.5 8L23 3"/>
  </g>
  <text x="472" y="1300" fill="#444e59" font-family="Arial,sans-serif" font-size="18">derthra.solutions@gmail.com</text>
  <text x="1008" y="1300" text-anchor="end" fill="#8a6800" font-family="Arial,sans-serif" font-size="18" font-weight="800">DERTHRA.COM</text>
