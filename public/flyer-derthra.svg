    <text x="157" y="814" fill="#20242b" font-size="25" font-weight="750">Inteligencia artificial</text>
    <text x="102" y="860" fill="#56606b" font-size="18">Automatización y análisis inteligente</text><text x="102" y="887" fill="#56606b" font-size="18">de imágenes, voz y datos.</text>

    <circle cx="605" cy="807" r="23" fill="#fff2bf"/><text x="605" y="815" text-anchor="middle" fill="#8a6800" font-size="17" font-weight="800">IoT</text>
    <text x="643" y="814" fill="#20242b" font-size="25" font-weight="750">IoT y automatización</text>
    <text x="588" y="860" fill="#56606b" font-size="18">Sensores y sistemas conectados</text><text x="588" y="887" fill="#56606b" font-size="18">para optimizar procesos.</text>

    <circle cx="119" cy="1001" r="23" fill="#fff2bf"/><text x="119" y="1009" text-anchor="middle" fill="#8a6800" font-size="20" font-weight="800">I+D</text>
    <text x="157" y="1008" fill="#20242b" font-size="25" font-weight="750">Investigación aplicada</text>
    <text x="102" y="1054" fill="#56606b" font-size="18">Prototipos y proyectos tecnológicos</text><text x="102" y="1081" fill="#56606b" font-size="18">con inteligencia artificial.</text>

    <circle cx="605" cy="1001" r="23" fill="#fff2bf"/><text x="605" y="1009" text-anchor="middle" fill="#8a6800" font-size="19" font-weight="800">&lt;/&gt;</text>
    <text x="643" y="1008" fill="#20242b" font-size="25" font-weight="750">Derthra Code</text>
    <text x="588" y="1054" fill="#56606b" font-size="18">Cursos prácticos de C++, Python</text><text x="588" y="1081" fill="#56606b" font-size="18">y Ada para distintos niveles.</text>
  </g>

  <rect x="72" y="1142" width="936" height="112" rx="18" fill="#fff8e3" stroke="#e8d99e"/>
  <rect x="72" y="1142" width="7" height="112" rx="3.5" fill="url(#gold)"/>
  <text x="104" y="1183" fill="#20242b" font-family="Arial,sans-serif" font-size="23" font-weight="750">¿Buscas orientación para tu proyecto o tesis?</text>
  <text x="104" y="1220" fill="#56606b" font-family="Arial,sans-serif" font-size="18">Asesoría académica en sistemas y desarrollo de software.</text>
  <text x="72" y="1300" fill="#20242b" font-family="Arial,sans-serif" font-size="19" font-weight="700">Hablemos</text>
  <g transform="translate(184 1277)" aria-label="WhatsApp">
