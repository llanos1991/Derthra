  <g filter="url(#shadow)">
    <rect x="72" y="754" width="450" height="170" rx="18" fill="#ffffff"/>
    <rect x="558" y="754" width="450" height="170" rx="18" fill="#ffffff"/>
    <rect x="72" y="948" width="450" height="170" rx="18" fill="#ffffff"/>
    <rect x="558" y="948" width="450" height="170" rx="18" fill="#ffffff"/>
  </g>
  <g font-family="Arial,sans-serif">
