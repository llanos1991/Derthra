    <path d="M8 24l1.4-4.1a10 10 0 1 1 3.4 3.1L8 24z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M12.4 11.2c-.5-.9-1-.8-1.3-.8-.4 0-.8 0-1.1.4-.4.4-1.4 1.3-1.4 3.1s1.4 3.6 1.6 3.9c.2.3 2.7 4.2 6.5 5.7 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.7.2-1.9-.1-.2-.4-.3-.9-.6l-2.6-1.3c-.4-.2-.7-.2-1 .3-.3.4-1.1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.8-.7-3.4-2.2-1.2-1.1-2-2.5-2.2-2.9-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5-.1-.7l-1.2-2.6z" transform="translate(2 -2) scale(.78)" fill="#fff"/>
